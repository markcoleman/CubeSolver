name: iOS CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - '.swiftlint.yml'
      - 'scripts/pre-commit-check.sh'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Package.swift'
      - '.swiftlint.yml'
      - 'scripts/pre-commit-check.sh'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

# Cancel in-progress runs for the same workflow and branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Run SwiftLint
      uses: norio-nomura/action-swiftlint@3.2.1
      with:
        args: --strict
      env:
        DIFF_BASE: ${{ github.base_ref }}

  build-and-test:
    name: Build and Test
    runs-on: macos-26
    needs: lint
    timeout-minutes: 30
    strategy:
      matrix:
        xcode: ['26.0']
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}
    
    - name: Verify Swift version
      run: |
        swift --version
        xcodebuild -version
    
    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          .build
        key: ${{ runner.os }}-spm-${{ matrix.xcode }}-${{ hashFiles('Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-spm-${{ matrix.xcode }}-
    
    - name: Install Swift dependencies
      run: swift package resolve
      
    - name: Build Swift package
      id: build
      run: |
        START_TIME=$(date +%s)
        swift build
        END_TIME=$(date +%s)
        BUILD_TIME=$((END_TIME - START_TIME))
        echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
        echo "Build completed in $BUILD_TIME seconds"
      
    - name: Run tests
      id: test
      run: |
        START_TIME=$(date +%s)
        swift test --enable-code-coverage --parallel
        END_TIME=$(date +%s)
        TEST_TIME=$((END_TIME - START_TIME))
        echo "test_time=$TEST_TIME" >> $GITHUB_OUTPUT
        echo "Tests completed in $TEST_TIME seconds"
      
    - name: Generate code coverage report
      if: matrix.xcode == '26.0'
      run: |
        # Find all test executables and generate coverage for each
        for test_exec in .build/debug/*.xctest/Contents/MacOS/*; do
          if [ -f "$test_exec" ]; then
            xcrun llvm-cov export -format="lcov" \
              "$test_exec" \
              -instr-profile .build/debug/codecov/default.profdata >> coverage.lcov 2>/dev/null || true
          fi
        done
      
    - name: Upload coverage to Codecov
      if: matrix.xcode == '26.0'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.lcov
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        
    - name: Check code coverage threshold
      if: matrix.xcode == '26.0'
      run: |
        # Extract coverage percentage (basic check)
        if [ -f coverage.lcov ]; then
          echo "Coverage report generated successfully"
        else
          echo "Warning: No coverage report generated"
        fi
    
    - name: Publish build performance summary
      if: matrix.xcode == '26.0'
      run: |
        echo "## Build Performance Report" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| Metric | Time |" >> "$GITHUB_STEP_SUMMARY"
        echo "|--------|------|" >> "$GITHUB_STEP_SUMMARY"
        echo "| Build | ${{ steps.build.outputs.build_time }}s |" >> "$GITHUB_STEP_SUMMARY"
        echo "| Test | ${{ steps.test.outputs.test_time }}s |" >> "$GITHUB_STEP_SUMMARY"

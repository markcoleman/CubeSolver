name: Capture Screenshots

on:
  pull_request:
    branches: [ main ]
    # Run when explicitly requested with a label and on subsequent updates
    types: [opened, reopened, labeled, synchronize]
  workflow_dispatch:
    inputs:
      dark_mode:
        description: 'Capture dark mode screenshots'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Cancel in-progress runs for the same workflow and branch
concurrency:
  group: capture-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-ios-screenshots:
    name: Capture iOS Screenshots
    runs-on: macos-26
    timeout-minutes: 45
    # Only run when explicitly requested (PR label) or manually.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'screenshots'))
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0'
    
    - name: Verify Swift version
      run: |
        swift --version
        xcodebuild -version
    
    - name: Install fastlane
      run: |
        # Keep this lightweight: install only if future lanes are enabled.
        if command -v fastlane &> /dev/null; then
          fastlane --version
        else
          echo "fastlane not installed (optional for this workflow)"
        fi
    
    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-spm-xcode26-v1
        restore-keys: |
          ${{ runner.os }}-spm-xcode26-
          ${{ runner.os }}-spm-
    
    - name: Install dependencies
      run: swift package resolve
    
    - name: Build for testing
      run: |
        xcodebuild build-for-testing \
          -scheme CubeSolver \
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
          -derivedDataPath .build/DerivedData
    
    - name: Run UI tests and capture screenshots
      run: |
        xcodebuild test-without-building \
          -scheme CubeSolver \
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro' \
          -derivedDataPath .build/DerivedData \
          -resultBundlePath .build/TestResults.xcresult
      continue-on-error: true
    
    - name: Extract screenshots from test results
      run: |
        ./scripts/extract_screenshots.sh .build/TestResults.xcresult docs/images/screenshots
      continue-on-error: true
    
    - name: Generate screenshots with fastlane (if configured)
      if: success() && false  # Disabled by default, enable when ready
      run: |
        cd fastlane
        fastlane ios screenshots
      continue-on-error: true
    
    - name: Upload screenshots as artifacts
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: ios-screenshots
        path: |
          docs/images/screenshots/
          fastlane/screenshots/
          .build/TestResults.xcresult
        retention-days: 30
    
    - name: Create screenshots summary
      if: always()
      run: |
        echo "## 📸 Screenshots Captured" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ -d "docs/images/screenshots" ] && [ "$(ls -A docs/images/screenshots)" ]; then
          echo "### UI Test Screenshots" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          for img in docs/images/screenshots/*.png; do
            if [ -f "$img" ]; then
              filename=$(basename "$img")
              echo "- \`$filename\`" >> $GITHUB_STEP_SUMMARY
            fi
          done
        else
          echo "⚠️ No screenshots were captured from UI tests" >> $GITHUB_STEP_SUMMARY
        fi
    

name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Cancel in-progress runs for the same workflow and branch/PR
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Run SwiftLint
      uses: norio-nomura/action-swiftlint@3.2.1
      with:
        args: --strict
      env:
        DIFF_BASE: ${{ github.base_ref }}

  build-and-test:
    name: Build and Test
    runs-on: macos-26
    needs: lint
    strategy:
      matrix:
        xcode: ['26.0']
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.xcode }}
    
    - name: Verify Swift version
      run: |
        swift --version
        xcodebuild -version
    
    - name: Cache Swift Package Manager
      uses: actions/cache@v5
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ runner.os }}-spm-${{ matrix.xcode }}-v1
        restore-keys: |
          ${{ runner.os }}-spm-${{ matrix.xcode }}-
          ${{ runner.os }}-spm-
    
    - name: Install Swift dependencies
      run: swift package resolve
      
    - name: Build Swift package
      id: build
      run: |
        START_TIME=$(date +%s)
        swift build
        END_TIME=$(date +%s)
        BUILD_TIME=$((END_TIME - START_TIME))
        echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT
        echo "Build completed in $BUILD_TIME seconds"
      
    - name: Run tests
      id: test
      run: |
        START_TIME=$(date +%s)
        swift test --enable-code-coverage --parallel
        END_TIME=$(date +%s)
        TEST_TIME=$((END_TIME - START_TIME))
        echo "test_time=$TEST_TIME" >> $GITHUB_OUTPUT
        echo "Tests completed in $TEST_TIME seconds"
      
    - name: Generate code coverage report
      if: matrix.xcode == '26.0'
      run: |
        # Find all test executables and generate coverage for each
        for test_exec in .build/debug/*.xctest/Contents/MacOS/*; do
          if [ -f "$test_exec" ]; then
            xcrun llvm-cov export -format="lcov" \
              "$test_exec" \
              -instr-profile .build/debug/codecov/default.profdata >> coverage.lcov 2>/dev/null || true
          fi
        done
      
    - name: Upload coverage to Codecov
      if: matrix.xcode == '26.0'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.lcov
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        
    - name: Check code coverage threshold
      if: matrix.xcode == '26.0'
      run: |
        # Extract coverage percentage (basic check)
        if [ -f coverage.lcov ]; then
          echo "Coverage report generated successfully"
        else
          echo "Warning: No coverage report generated"
        fi
    
    - name: Comment build performance on PR
      if: github.event_name == 'pull_request' && matrix.xcode == '26.0'
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const buildTime = '${{ steps.build.outputs.build_time }}';
          const testTime = '${{ steps.test.outputs.test_time }}';
          const totalTime = parseInt(buildTime) + parseInt(testTime);
          
          const body = `## ⏱️ Build Performance Report
          
          | Metric | Time |
          |--------|------|
          | **Build** | ${buildTime}s |
          | **Test** | ${testTime}s |
          | **Total** | ${totalTime}s |
          
          *Measured with SPM caching enabled.*`;
          
          // Find existing performance comment
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100
          });
          
          const botComment = comments.data.find(comment => 
            comment.user.login === 'github-actions[bot]' && 
            comment.body.includes('## ⏱️ Build Performance Report')
          );
          
          if (botComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: body
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }
